<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeshPay · Checkout</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d27;
    --border: #2a2d3a;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --green: #22c55e;
    --red: #ef4444;
    --blue: #3b82f6;
    --yellow: #eab308;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
  .logo { font-size: 1.4rem; font-weight: 800; margin-bottom: 24px; letter-spacing: -0.02em; }
  .logo span { color: var(--blue); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; }
  .product { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .product-icon { width: 56px; height: 56px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex-shrink: 0; }
  .product-name { font-weight: 700; font-size: 1rem; }
  .product-desc { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .product-price { margin-left: auto; font-size: 1.3rem; font-weight: 800; color: var(--blue); }
  .breakdown { margin-bottom: 20px; }
  .row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 4px 0; }
  .row.total { font-weight: 700; font-size: 1rem; border-top: 1px solid var(--border); margin-top: 8px; padding-top: 10px; }
  .pay-btn { width: 100%; padding: 16px; background: var(--blue); color: white; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: all 0.2s; letter-spacing: 0.01em; }
  .pay-btn:hover { background: #2563eb; transform: translateY(-1px); }
  .pay-btn:active { transform: translateY(0); }
  .pay-btn:disabled { background: #334155; color: var(--muted); cursor: not-allowed; transform: none; }
  .status-box { margin-top: 20px; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: none; }
  .status-box.visible { display: block; }
  .status-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px; }
  .step { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 0.85rem; }
  .step-icon { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; flex-shrink: 0; }
  .step-icon.pending { background: #1e293b; color: var(--muted); }
  .step-icon.loading { background: #1e3a5f; color: var(--blue); animation: spin 1s linear infinite; }
  .step-icon.done { background: rgba(34,197,94,0.15); color: var(--green); }
  .step-icon.error { background: rgba(239,68,68,0.15); color: var(--red); }
  .step-icon.healed { background: rgba(234,179,8,0.15); color: var(--yellow); }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  .step-label { flex: 1; }
  .step-latency { font-size: 0.72rem; color: var(--muted); }
  .result-banner { margin-top: 16px; padding: 14px; border-radius: 10px; text-align: center; font-weight: 700; display: none; }
  .result-banner.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: var(--green); display: block; }
  .result-banner.healed { background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.3); color: var(--yellow); display: block; }
  .result-banner.failed { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--red); display: block; }
  .txn-id { font-size: 0.72rem; color: var(--muted); text-align: center; margin-top: 8px; }
  .degrade-toggle { margin-top: 16px; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: space-between; font-size: 0.82rem; }
  .toggle-switch { position: relative; width: 40px; height: 22px; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #334155; border-radius: 22px; cursor: pointer; transition: 0.3s; }
  .slider:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
  input:checked + .slider { background: var(--red); }
  input:checked + .slider:before { transform: translateX(18px); }
  .degrade-label { color: var(--muted); }
  .degrade-label span { color: var(--red); font-weight: 600; }
  .mesh-indicator { margin-top: 10px; font-size: 0.72rem; color: var(--muted); text-align: center; }
  .mesh-indicator b { color: var(--text); }
</style>
</head>
<body>

<div class="logo">Mesh<span>Pay</span></div>

<div class="card">
  <div class="product">
    <div class="product-icon">🛒</div>
    <div>
      <div class="product-name">Premium AI Course</div>
      <div class="product-desc">MeshHeal-AI · Lifetime Access</div>
    </div>
    <div class="product-price">₹499</div>
  </div>

  <div class="breakdown">
    <div class="row"><span>Subtotal</span><span>₹499.00</span></div>
    <div class="row"><span>GST (18%)</span><span>₹89.82</span></div>
    <div class="row"><span>Discount</span><span style="color:var(--green)">-₹88.82</span></div>
    <div class="row total"><span>Total</span><span>₹500.00</span></div>
  </div>

  <button class="pay-btn" id="payBtn" onclick="makePayment()">
    Pay ₹500 →
  </button>

  
  <div class="degrade-toggle">
    <div class="degrade-label">Simulate fault: <span>payments degraded</span></div>
    <label class="toggle-switch">
      <input type="checkbox" id="degradeToggle" onchange="toggleDegradation(this.checked)">
      <span class="slider"></span>
    </label>
  </div>

  <div class="mesh-indicator">
    Routed via <b>Envoy → gateway → auth → orders → payments → inventory</b>
  </div>

  
  <div class="status-box" id="statusBox">
    <div class="status-title">Transaction Pipeline · Live</div>
    <div id="steps"></div>
    <div class="result-banner" id="resultBanner"></div>
    <div class="txn-id" id="txnId"></div>
  </div>
</div>

<script>
const GATEWAY = '';
const TELEMETRY = 'http://localhost:5000';
const DEGRADATION_URL = 'http://localhost:4003';

const STEPS = [
  { id: 'envoy',    label: 'Envoy Proxy',   icon: '⚡' },
  { id: 'gateway',  label: 'Gateway',       icon: '🔀' },
  { id: 'auth',     label: 'Auth Service',  icon: '🔐' },
  { id: 'orders',   label: 'Orders',        icon: '📦' },
  { id: 'payments', label: 'Payments',      icon: '💳' },
  { id: 'inventory',label: 'Inventory',     icon: '🏪' },
];

function renderSteps(states) {
  const container = document.getElementById('steps');
  container.innerHTML = STEPS.map(s => {
    const state = states[s.id] || 'pending';
    const latency = states[s.id + '_latency'] || '';
    return `<div class="step">
      <div class="step-icon ${state}">${state === 'loading' ? '↻' : state === 'done' ? '✓' : state === 'error' ? '✗' : state === 'healed' ? '⚡' : s.icon}</div>
      <div class="step-label">${s.label}</div>
      ${latency ? `<div class="step-latency">${latency}ms</div>` : ''}
    </div>`;
  }).join('');
}

async function toggleDegradation(on) {
  try {
    await fetch(`${DEGRADATION_URL}/set-degradation`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({level: on ? 0.8 : 0})
    });
  } catch(e) {}
}

async function makePayment() {
  const btn = document.getElementById('payBtn');
  const statusBox = document.getElementById('statusBox');
  const resultBanner = document.getElementById('resultBanner');
  const txnId = document.getElementById('txnId');

  btn.disabled = true;
  btn.textContent = 'Processing...';
  statusBox.classList.add('visible');
  resultBanner.className = 'result-banner';
  resultBanner.textContent = '';
  txnId.textContent = '';

  const states = {};
  STEPS.forEach(s => states[s.id] = 'pending');
  renderSteps(states);

  // Animate steps one by one
  async function activateStep(id, delay) {
    await new Promise(r => setTimeout(r, delay));
    states[id] = 'loading';
    renderSteps(states);
  }

  activateStep('envoy', 100);
  activateStep('gateway', 400);
  activateStep('auth', 700);
  activateStep('orders', 1000);
  activateStep('payments', 1300);
  activateStep('inventory', 1600);

  const t0 = Date.now();
  let result, success = false, selfHealed = false;

  try {
    const resp = await fetch(`${GATEWAY}/checkout`, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'ngrok-skip-browser-warning': 'true'},
      body: JSON.stringify({item: 'premium-ai-course'})
    });
    result = await resp.json();
    success = result.checkoutComplete === true;
    const totalMs = Date.now() - t0;

    selfHealed = totalMs > 1500 && document.getElementById('degradeToggle').checked;

    const perStep = Math.floor(totalMs / 6);
    STEPS.forEach((s, i) => {
      states[s.id] = selfHealed && s.id === 'payments' ? 'healed' : 'done';
      states[s.id + '_latency'] = perStep * (i + 1);
    });
    renderSteps(states);

    if (selfHealed) {
      resultBanner.className = 'result-banner healed';
      resultBanner.textContent = '⚡ Self-Healed · Payment Succeeded';
    } else {
      resultBanner.className = 'result-banner success';
      resultBanner.textContent = '✓ Payment Successful';
    }
    txnId.textContent = `TXN: MESH${Date.now()} · ${totalMs}ms total`;

  } catch(e) {
    STEPS.forEach(s => { if(states[s.id] === 'loading') states[s.id] = 'error'; });
    renderSteps(states);
    resultBanner.className = 'result-banner failed';
    resultBanner.textContent = '✗ Payment Failed · Retrying...';
  }

  btn.disabled = false;
  btn.textContent = 'Pay Again →';
}
</script>
</body>
</html>
